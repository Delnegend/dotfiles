# Custom provider: self-hosted Bifrost AI gateway (ai.delnegend.com).
#
# Bifrost fronts zero-g (agy, codex, opencode-zen) and is
# protected by virtual keys (enforce_auth_on_inference). The key lives in
# ~/.omp/agent/.env as BIFROST_API_KEY — never commit it here.
#
# Model ids are gateway-qualified, e.g.:
#   bifrost/agy/claude-sonnet-5-5-medium
#   bifrost/codex/gpt-5.6-sol
#   bifrost/opencode-zen/deepseek-v4.1-flash-free
providers:
  bifrost:
    baseUrl: https://ai.delnegend.com/v1
    api: openai-completions
    apiKey: BIFROST_API_KEY
    authHeader: true
    discovery:
      type: openai-models-list
      injectV1: false
