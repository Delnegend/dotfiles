modelRoles:
  web: web/kagi
  vision: opencode-go/deepseek-v4.1-flash:auto
  default: openai-codex/gpt-6.1-terra:high
symbolPreset: ascii
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-terminal
  light: light
setupVersion: 2
github:
  enabled: true
defaultThinkingLevel: auto
hideThinkingBlock: true
statusLine:
  preset: default
  separator: ascii
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: true
tui:
  renderMermaid: true
  reactions: true
  tight: false
display:
  cacheMissMarker: false
  shimmer: classic
  hideToolActivity: false
  showTokenUsage: false
  collapseCompacted: true
error:
  notify: "on"
memory:
  backend: hindsight
providers:
  autoThinkingMaxEffort: xhigh
power:
  sleepPrevention: idle
terminal:
  showProgress: true
showHardwareCursor: true
externalThinking: false
hindsight:
  apiUrl: https://hindsight.delnegend.com
  apiToken: "${HINDSIGHT_API_TOKEN}"
  bankId: coding
  scoping: global
autolearn:
  enabled: true
secrets:
  enabled: true
security:
  enabled: false
bashInterceptor:
  enabled: false
browser:
  enabled: false
codexResets:
  autoRedeem: "no"