# MPV configuration file

# Playback Core
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# Streaming / Network
cache=yes

# Dithering
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

dither-depth=10
dither=fruit

# Display target (HKC G27M2Pro peaks ~1015 nits per EDID)
target-peak=1000
target-colorspace-hint=yes
target-prim=bt.2020
target-trc=pq

# SDR -> HDR: inverse-tone-mapping brightens SDR nicely but also
# over-brightens real HDR highlights, so gate it per source type
inverse-tone-mapping=no

[sdr-upscale]
profile-cond=get("video-params/gamma") ~= "pq" and get("video-params/gamma") ~= "hlg"
profile-restore=copy
inverse-tone-mapping=yes

# Anime4K (off by default; F5 toggles on. SDR-trained, alters HDR look)
#glsl-shaders=~~/shaders/Anime4K_v4.0/Anime4K_Restore_CNN_L.glsl:~~/shaders/Anime4K_v4.0/Anime4K_Upscale_CNN_x2_L.glsl
