set -g mouse on
set -g base-index 1
# Require tmux 3.5+ for advanced key formatting
set -g extended-keys on
set -g extended-keys-format csi-u

# Allow image passthrough (Crucial for Kitty graphics / OMP inline images)
set -g allow-passthrough on

# Auto-detect available system clipboard tool
if-shell 'command -v wl-copy >/dev/null 2>&1' {
    set -s copy-command 'wl-copy'
} {
    if-shell 'command -v xclip >/dev/null 2>&1' {
        set -s copy-command 'xclip -selection clipboard -in'
    } {
        if-shell 'command -v clip.exe >/dev/null 2>&1' {
            set -s copy-command 'clip.exe'
        }
    }
}

# --- clipboard (system pipe + OSC 52 fallback) ---
# on: yanks propagate to the system clipboard AND app escape sequences
# (nvim, ssh remote editors) both create tmux buffers and reach the system clipboard
set -g set-clipboard on
# tmux only emits OSC 52 when terminfo has the Ms capability;
# xterm-256color does not have it, so force it for every client TERM
set -as terminal-overrides '*:Ms=\E]52;%p1%s;%p2%s\007'

# vi copy-mode: v = select, y = yank (tmux buffer + system clipboard), mouse drag = yank
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

